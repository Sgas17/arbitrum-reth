[package]
name = "arb-reth-derive"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Stage F: L1 inbox derivation. Decodes SequencerInbox batches (blob + calldata)
# into the canonical MessageWithMetadata stream: the trustless-sync half that lets the
# node reach tip standalone from L1. Pure offline decoder (no network I/O).
# See docs/stage-f-handoff.md.

[dependencies]
# Arbitrum message types from arb-alloy; alloy version unifies with reth's workspace.
arbitrum-alloy-sequencer = { git = "https://github.com/nuntax/arbitrum-alloy", rev = "83593650bf6d07d2255e8627c417a9236cd5d02b", default-features = false, features = ["std"] }
alloy-primitives = "1"
alloy-rlp = { workspace = true }
# brotli is re-exported from arb_revm (which vendors it) so both crates share one brotli
# source and avoid a lockfile collision. BUSL-licensed; see the arb_revm NOTICE.
arb-revm.workspace = true
# B2 uses the already locked crates.io decoder's incremental Read interface so cancellation and
# the decompressed-byte ceiling are checked between bounded output chunks. The existing Nitro
# decoder remains the byte-equivalence oracle in tests.
brotli-crates-io = { package = "brotli", version = "=8.0.4" }

[dev-dependencies]
serde_json = { workspace = true }
